# ==========================================================
#  EconomySystem - Einstellungen
# ==========================================================

config-version: 3

# Test-Befehle (/economysystem-admin tests ...) freischalten.
# ACHTUNG: Die Test-Befehle verändern echte Kontostände, indem sie
# Zinszyklen sofort ausführen. Nur auf Test-/Entwicklungsservern
# aktivieren.
tests:
  enabled: false

currency:
  # Anzeigename der Währung (z. B. in Nachrichten über %currency%)
  name: "Coins"

  # Symbol der Währung
  symbol: "$"

  # Anzeigeformat der Beträge.
  # Platzhalter: %symbol%, %amount%, %name%
  format: "%symbol%%amount%"

  # Zahlenformat (Java DecimalFormat-Pattern)
  number-format: "#,##0.00"

  # Locale für Trennzeichen (z. B. de-DE -> 1.234,56)
  locale: "de-DE"

  # Nachkommastellen (0 - 8)
  decimals: 2

  # Rundungsmodus:
  # UP, DOWN, CEILING, FLOOR, HALF_UP, HALF_DOWN, HALF_EVEN
  rounding: HALF_UP

  # Startguthaben für neue Spieler
  starting-balance: "100.00"

  # Maximales Guthaben ("-1" = unbegrenzt)
  max-balance: "1000000000.00"

  # Minimales Guthaben für erzwungene Abbuchungen (z. B. fällige Kredite).
  # "0" = kein Überziehen, negative Werte erlauben einen Dispo bis hierhin.
  min-balance: "-1000.00"

interest:
  # Zinszyklus automatisch ausführen
  enabled: true

  # Uhrzeit des ersten Laufs (Serverzeit, Format HH:mm)
  start-time: "00:01"

  # Abstand zwischen zwei Zinszyklen in Minuten
  # 1440 = täglich, 10080 = wöchentlich
  interval-minutes: 1440

  # Faktoren a der Blockcraft-Wirtschaftsformel y = a * sqrt(x)
  factors:
    # Sparzins - wird am Zyklusende allen Konten gutgeschrieben
    spar: "1.3"
    # Kreditzins - a in der Kreditformel y = x * m + a
    kredit: "1.3"

  # Online-Spieler nach jedem Zyklus über ihre persönliche Gutschrift
  # informieren (Chat). Bei kurzen Intervallen ggf. deaktivieren.
  notify-players: true

credits:
  # Kreditsystem aktivieren (/kredit)
  enabled: true

  # Maximale Anzahl gleichzeitiger Kredite pro Spieler
  max-loans: 3

  # Kreditrahmen = multiplier * (Guthaben - offene Kredite)
  # Ist das Guthaben nach Abzug der Kredite negativ, wird kein Kredit vergeben.
  limit-multiplier: "3.0"

  # Steigung m der Zinsformel y = x * m + a
  # x = Laufzeit in Tagen, a = interest.factors.kredit
  # y ist der absolute Zinsbetrag, der zusätzlich zurückgezahlt wird.
  slope: "0.5"

  # Mindestbetrag eines Kredits
  minimum-amount: "10.00"

  # Laufzeit in Tagen (natürliche Zahlen)
  min-days: 1
  max-days: 365

  # Intervall in Sekunden, in dem fällige Kredite geprüft werden
  check-interval-seconds: 60

  # Datumsformat für Fälligkeiten (Java DateTimeFormatter).
  # Beispiele: "dd.MM.yyyy HH:mm", "yyyy-MM-dd HH:mm"
  date-format: "dd.MM.yyyy HH:mm"

leaderboard:
  # Einträge pro Seite bei /money top
  page-size: 10

  # Maximale Anzahl Einträge, die für die Bestenliste geladen werden
  max-entries: 100

notifications:
  # Eigenes Guthaben kurz nach dem Beitritt im Chat anzeigen
  balance-on-join: true

  # Verzögerung in Ticks (20 = 1 Sekunde), damit Join-Nachrichten
  # anderer Plugins nicht überschrieben werden
  balance-on-join-delay-ticks: 20

suggestions:
  # Vorschläge für /pay <Spieler> <Betrag> (Tab-Taste)
  amounts:
    - "1"
    - "10"
    - "100"
    - "1000"
    - "10000"

  # Vorschläge für /kredit add <Betrag>
  credit-amounts:
    - "100"
    - "500"
    - "1000"
    - "5000"

  # Vorschläge für /kredit bezahlen [Betrag]
  repay-amounts:
    - "10"
    - "50"
    - "100"
    - "500"

  # Vorschläge für die Laufzeit in Tagen
  credit-days:
    - "7"
    - "30"
    - "90"

storage:
  # Speicherart: YAML oder MYSQL
  type: YAML

  # Intervall in Sekunden, in dem geänderte Konten gespeichert werden.
  # 0 = kein automatisches Speichern (nur beim Verlassen/Stoppen des Servers)
  save-interval-seconds: 300

  yaml:
    # Ordner (relativ zum Plugin-Ordner), in dem die Konten liegen
    folder: "accounts"

  mysql:
    host: "localhost"
    port: 3306
    database: "minecraft"
    # Eigenen Datenbanknutzer verwenden; Passwortdatei vor Zugriff schützen.
    username: "economysystem"
    password: ""
    # Präfix der Tabelle (nur A-Z, a-z, 0-9 und _)
    table-prefix: "economy_"

    # TLS-Modus: VERIFY_IDENTITY, VERIFY_CA, REQUIRED, PREFERRED oder DISABLED.
    # VERIFY_IDENTITY prüft Zertifikat und Hostnamen. Leer lassen, um
    # use-ssl zu verwenden (true -> VERIFY_IDENTITY, false -> DISABLED).
    ssl-mode: ""

    # Veraltet: wird nur ausgewertet, wenn ssl-mode leer ist.
    use-ssl: true

    connection-timeout-ms: 5000
    socket-timeout-ms: 30000
