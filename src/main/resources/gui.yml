# ==========================================================
#  EconomySystem - GUI-Menüs
# ==========================================================
# Jedes Item wird nur angezeigt, wenn der Spieler die unter
# "permission" angegebene Berechtigung besitzt. Beim Klick werden
# die Befehle unter "commands" so ausgeführt, als hätte der Spieler
# sie selbst eingegeben (/money, /pay, /kredit, ...).
#
# Eingaben (inputs): Vor dem Ausführen werden Werte abgefragt.
#   - type: number  -> Regler aus Glasscheiben (ganze Zahlen)
#       min, max, step, default
#   - type: text    -> Nametag im Amboss benennen
#   - type: player  -> Kopfauswahl mit Suche, Filter und Sortierung
#       filter: all | online
#       sort:   name-asc | name-desc | balance-desc | balance-asc
#
# Platzhalter in commands:
#   {player}  Name des Spielers
#   {input}   alle Antworten (mit Leerzeichen verbunden)
#   {input1}  erste Antwort, {input2} zweite Antwort, ...
#   {inputN}  N-te Antwort (N = Position in inputs)
#
# open:    öffnet ein anderes Menü statt Befehle auszuführen.
# slot:    0 - (rows * 9 - 1)
# ==========================================================

config-version: 1

settings:
  # Menü-System aktivieren (/economysystem-gui)
  enabled: true

  # Menü, das ohne Argument geöffnet wird
  default-menu: "main"

  # Inventar schließen, bevor ein Befehl ausgeführt wird
  close-on-click: true

menus:
  main:
    title: "&8&lWirtschaft"
    rows: 6
    fill:
      material: GRAY_STAINED_GLASS_PANE
      name: " "
    items:
      balance:
        slot: 10
        material: GOLD_INGOT
        name: "&6&lGuthaben"
        lore:
          - "&7Zeigt dein aktuelles Guthaben."
        permission: "economysystem.balance"
        commands:
          - "money"

      balance-others:
        slot: 12
        material: SUNFLOWER
        name: "&e&lGuthaben anderer"
        lore:
          - "&7Zeigt das Guthaben eines Spielers."
        permission: "economysystem.balance.others"
        inputs:
          - type: player
            prompt: "&8Spieler wählen"
        commands:
          - "money {input1}"

      pay:
        slot: 14
        material: EMERALD
        name: "&a&lGeld überweisen"
        lore:
          - "&7Überweist Geld an einen Spieler."
        permission: "economysystem.pay"
        inputs:
          - type: player
            prompt: "&8Spieler wählen"
          - type: number
            prompt: "&8Betrag"
            min: 1
            max: 1000000
            step: 10
            default: 100
        commands:
          - "pay {input1} {input2}"

      help:
        slot: 16
        material: PAPER
        name: "&f&lHilfe"
        lore:
          - "&7Zeigt alle Befehle im Chat."
        commands:
          - "economysystem help"

      kredit-add:
        slot: 20
        material: DIAMOND
        name: "&b&lKredit aufnehmen"
        lore:
          - "&7Nimmt einen Kredit auf."
          - "&8» &7Rahmen und Zinsen stehen in der settings.yml."
        permission: "economysystem.kredit"
        inputs:
          - type: number
            prompt: "&8Kreditbetrag"
            min: 10
            max: 1000000
            step: 100
            default: 100
          - type: number
            prompt: "&8Laufzeit in Tagen"
            min: 1
            max: 365
            step: 1
            default: 30
        commands:
          - "kredit add {input1} {input2}"

      kredit-info:
        slot: 22
        material: BOOK
        name: "&b&lKredit-Info"
        lore:
          - "&7Zeigt Guthaben, Rahmen und laufende Kredite."
        permission: "economysystem.kredit"
        commands:
          - "kredit info"

      kredit-pay:
        slot: 24
        material: GOLD_NUGGET
        name: "&6&lKredit zurückzahlen"
        lore:
          - "&7Zahlt so viel zurück, wie dein Guthaben erlaubt."
        permission: "economysystem.kredit"
        commands:
          - "kredit bezahlen"

      kredit-pay-part:
        slot: 26
        material: GOLD_INGOT
        name: "&6&lTeilbetrag zahlen"
        lore:
          - "&7Zahlt einen bestimmten Betrag zurück."
        permission: "economysystem.kredit"
        inputs:
          - type: number
            prompt: "&8Betrag"
            min: 1
            max: 1000000
            step: 10
            default: 10
        commands:
          - "kredit bezahlen {input1}"

      admin:
        slot: 49
        material: NETHER_STAR
        name: "&c&lAdmin-Menü"
        lore:
          - "&7Verwaltet Guthaben, Zinsen und Einstellungen."
        permission: "economysystem.admin"
        open: "admin"

  admin:
    title: "&8&lWirtschaft &r&c&lAdmin"
    rows: 6
    permission: "economysystem.admin"
    fill:
      material: BLACK_STAINED_GLASS_PANE
      name: " "
    items:
      info:
        slot: 10
        material: BOOK
        name: "&e&lSystem-Info"
        lore:
          - "&7Zeigt Speicher, Währung, Zinsen und Zyklus."
        permission: "economysystem.admin"
        commands:
          - "economysystem-admin info"

      help:
        slot: 12
        material: PAPER
        name: "&f&lAdmin-Hilfe"
        lore:
          - "&7Zeigt die mehrseitige Admin-Hilfe."
        permission: "economysystem.admin"
        commands:
          - "economysystem-admin help"

      reload:
        slot: 14
        material: CLOCK
        name: "&a&lNeu laden"
        lore:
          - "&7Lädt alle Konfigurationen neu."
        permission: "economysystem.reload"
        commands:
          - "economysystem-admin reload"

      tests:
        slot: 16
        material: REDSTONE_TORCH
        name: "&c&lZinszyklen testen"
        lore:
          - "&7Simuliert Zinszyklen sofort."
          - "&8» &7Nur mit &etests.enabled: true&7."
        permission: "economysystem.tests"
        inputs:
          - type: number
            prompt: "&8Anzahl der Zyklen"
            min: 1
            max: 1000
            step: 1
            default: 1
        commands:
          - "economysystem-admin tests zins-zyklus add {input1}"

      money-add:
        slot: 19
        material: EMERALD
        name: "&a&lGeld hinzufügen"
        lore:
          - "&7Schreibt einem Spieler Geld gut."
        permission: "economysystem.admin"
        inputs:
          - type: player
            prompt: "&8Spieler wählen"
          - type: number
            prompt: "&8Betrag"
            min: 1
            max: 1000000
            step: 10
            default: 100
        commands:
          - "economysystem-admin money {input1} add {input2}"

      money-remove:
        slot: 20
        material: REDSTONE
        name: "&c&lGeld abziehen"
        lore:
          - "&7Zieht einem Spieler Geld ab."
        permission: "economysystem.admin"
        inputs:
          - type: player
            prompt: "&8Spieler wählen"
          - type: number
            prompt: "&8Betrag"
            min: 1
            max: 1000000
            step: 10
            default: 100
        commands:
          - "economysystem-admin money {input1} remove {input2}"

      money-set:
        slot: 21
        material: DIAMOND
        name: "&b&lGuthaben setzen"
        lore:
          - "&7Setzt das Guthaben exakt."
        permission: "economysystem.admin"
        inputs:
          - type: player
            prompt: "&8Spieler wählen"
          - type: number
            prompt: "&8Betrag"
            min: 0
            max: 1000000
            step: 10
            default: 100
        commands:
          - "economysystem-admin money {input1} set {input2}"

      money-reset:
        slot: 23
        material: BARRIER
        name: "&c&lGuthaben zurücksetzen"
        lore:
          - "&7Setzt das Guthaben auf das Startguthaben."
        permission: "economysystem.admin"
        inputs:
          - type: player
            prompt: "&8Spieler wählen"
        commands:
          - "economysystem-admin money {input1} reset"

      spar-set:
        slot: 29
        material: WHEAT
        name: "&6&lSparzins setzen"
        lore:
          - "&7Setzt den Faktor a des Sparzinses."
        permission: "economysystem.admin"
        inputs:
          - type: text
            prompt: "&8Neuer Sparzins-Faktor"
        commands:
          - "economysystem-admin zinsen spar set {input1}"

      kredit-set:
        slot: 31
        material: IRON_INGOT
        name: "&6&lKreditzins setzen"
        lore:
          - "&7Setzt a in y = x · m + a."
        permission: "economysystem.admin"
        inputs:
          - type: text
            prompt: "&8Neuer Kreditzins-Faktor"
        commands:
          - "economysystem-admin zinsen kredit set {input1}"

      back:
        slot: 49
        material: ARROW
        name: "&7&lZurück"
        lore:
          - "&7Öffnet das Hauptmenü."
        open: "main"
