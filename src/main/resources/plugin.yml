name: EconomySystem
description: BigDecimal-Guthaben mit YAML- und MySQL-Speicher
prefix: EconomySystem
version: '${version}'

main: de.Minefalo.economySystem.EconomySystem
api-version: '26.3'
load: POSTWORLD
softdepend: [ PlaceholderAPI ]

authors: [ Minefalo ]

# Wird von Paper automatisch heruntergeladen und geladen.
# Dadurch funktioniert der MySQL-Speicher ohne zusätzliche Installation.
libraries:
  - com.mysql:mysql-connector-j:9.1.0

# Aliase werden in der commands.yml registriert.
commands:
  money:
    description: Zeigt dein Guthaben oder das eines Spielers an.
    usage: /money [Spieler]
  pay:
    description: Überweist Geld an einen anderen Spieler.
    usage: /pay <Spieler> <Betrag>
  economysystem:
    description: Hauptbefehl für die Hilfe.
    usage: /economysystem <help>
  economysystem-admin:
    description: Admin-Befehl für Geldverwaltung, Zinsen, Informationen, Reload und Tests.
    usage: /economysystem-admin <help|info|reload|money|zinsen|tests>

permissions:
  economysystem.balance:
    description: Erlaubt das Anzeigen des eigenen Guthabens.
    default: true
  economysystem.balance.others:
    description: Erlaubt das Anzeigen fremder Guthaben.
    default: op
  economysystem.pay:
    description: Erlaubt das Überweisen von Geld an andere Spieler.
    default: true
  economysystem.admin:
    description: Erlaubt die Admin-Befehle (Geldverwaltung, Zinsen, Info).
    default: op
  economysystem.reload:
    description: Erlaubt zusätzlich zu economysystem.admin das Neuladen über /economysystem-admin reload.
    default: op
  economysystem.tests:
    description: Erlaubt zusätzlich zu economysystem.admin die Test-Befehle (nur wenn tests.enabled in der settings.yml aktiv ist).
    default: op
