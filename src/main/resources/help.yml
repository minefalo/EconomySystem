# ==========================================================
#  EconomySystem - Admin-Hilfe
# ==========================================================
# Diese Datei wird von /economysystem-admin help gelesen.
# Jede Seite hat einen Titel und beliebig viele Zeilen.
# Die Navigation unter der Seite ist im Chat klickbar.
#
# Platzhalter:
#   %title%  Titel der aktuellen Seite
#   %page%   aktuelle Seite
#   %pages%  Anzahl der Seiten
#
# Farben: &0-&f, &l, &o, &n, &m, &k, &r, Hex: &#RRGGBB
# ==========================================================

title: "&8&m          &r &6&lEconomySystem &7- Admin &r&8&m          "
page-title: "&e&l%title% &8(&7Seite %page%/%pages%&8)"
page-indicator: "&7Seite &e%page% &7von &e%pages%"

navigation:
  previous: "&a« Zurück"
  next: "&aWeiter »"
  previous-hover: "&7Klicke, um zu Seite %page% zu wechseln."
  next-hover: "&7Klicke, um zu Seite %page% zu wechseln."

pages:
  - title: "Übersicht"
    lines:
      - "&7Verwalte Guthaben und Zinsen des Servers."
      - ""
      - "&e/economysystem-admin help [Seite]"
      - "&8  » &7Zeigt diese Hilfe (mehrere Seiten)."
      - "&e/economysystem-admin info"
      - "&8  » &7Zeigt Speicher, Währung, Zinsen und Zyklus."
      - "&e/economysystem-admin reload"
      - "&8  » &7Lädt alle Konfigurationen neu."
      - "&e/economysystem-admin money <Spieler> add|remove|set <Betrag>"
      - "&8  » &7Ändert das Guthaben eines Spielers."
      - "&e/economysystem-admin money <Spieler> reset"
      - "&8  » &7Setzt das Guthaben auf das Startguthaben zurück."
      - "&e/economysystem-admin zinsen <spar|kredit> set <Faktor>"
      - "&8  » &7Setzt den Faktor a der Zinsformel."
      - "&e/economysystem-admin tests zins-zyklus add <Anzahl>"
      - "&8  » &7Führt Zinszyklen sofort aus (nur mit tests.enabled)."

  - title: "Geldverwaltung"
    lines:
      - "&e/economysystem-admin money <Spieler> add <Betrag>"
      - "&8  » &7Schreibt dem Spieler Geld gut."
      - "&e/economysystem-admin money <Spieler> remove <Betrag>"
      - "&8  » &7Zieht dem Spieler Geld ab."
      - "&e/economysystem-admin money <Spieler> set <Betrag>"
      - "&8  » &7Setzt das Guthaben exakt auf den Betrag."
      - "&e/economysystem-admin money <Spieler> reset"
      - "&8  » &7Setzt das Guthaben auf das konfigurierte Startguthaben."
      - ""
      - "&7Beträge werden mit &e.&7 oder &e,&7 als Dezimaltrennzeichen akzeptiert."
      - "&7Das maximale Guthaben aus der &esettings.yml &7wird immer beachtet."

  - title: "Zinsen"
    lines:
      - "&7Formel: &e y = a · √x"
      - "&8  » &7x = Kontostand, a = Zinsfaktor, y = Zinsbetrag"
      - "&8  » &7gültig für x ≥ 0 und a > 0"
      - ""
      - "&e/economysystem-admin zinsen spar set <Faktor>"
      - "&8  » &7Setzt den Sparzins (Standard: 1.3)."
      - "&8  » &7Wird am Ende des nächsten Zinszyklus gutgeschrieben."
      - "&e/economysystem-admin zinsen kredit set <Faktor>"
      - "&8  » &7Setzt a in der Kreditformel y = x · m + a."
      - ""
      - "&7Der Zinszyklus läuft für &ealle gespeicherten Konten&7, auch offline."
      - "&7Zeitplan und Intervall stehen in der &esettings.yml&7."

  - title: "Tests"
    lines:
      - "&cAchtung: &7Test-Befehle verändern echte Kontostände."
      - "&7Sie sind nur aktiv, wenn in der &esettings.yml"
      - "&e tests.enabled: true &7gesetzt und neu geladen wurde."
      - ""
      - "&e/economysystem-admin tests zins-zyklus add <Anzahl>"
      - "&8  » &7Führt den Zinszyklus sofort &e<Anzahl> &7-mal aus."
      - "&8  » &7Jeder Lauf baut auf dem Guthaben des vorherigen auf,"
      - "&8  » &7simuliert also vergangene Zyklen (1 - 1000)."
      - ""
      - "&7Es wird immer der aktuelle &eSparzins-Faktor &7verwendet,"
      - "&7auch wenn der automatische Zinszyklus deaktiviert ist."
