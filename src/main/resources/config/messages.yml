# ==========================================================
#  EconomySystem - Nachrichten
# ==========================================================
# Formatierung: MiniMessage-Markup, z. B. <red>, <bold>, <gray>,
# <#RRGGBB> für Hex-Farben und <reset> zum Zurücksetzen.
# Wörtliche spitze Klammern werden mit \<...> geschrieben.
#
# Platzhalter werden automatisch ersetzt (z. B. %balance%, %player%).
# %prefix% kann überall eingefügt werden; ohne %prefix% wird er
# automatisch vor die Nachricht gesetzt.
#
# Schlüssel sind case-sensitive. Fehlt ein Schlüssel, zeigt das Plugin
# den Schlüsselnamen an und loggt eine Warnung. Alte Schlüssel
# (no-permission, usage-..., pay-recipient-offline) bleiben als
# Fallback gültig; die neuen command.*-Schlüssel haben Vorrang.
#
# Die Listen help und help-admin gehören zu /eco help. Die mehrseitige
# Admin-Hilfe aus help.yml wird nur von /eco admin help gelesen.
# ==========================================================

prefix: "<dark_red><bold>BC <reset><gold>EconomySystem<reset><red> » "

# ------------------------------------------------------------------
# Neue Schlüssel nach dem Schema aus Commands.md (Abschnitt 9.1/9.2).
# command._default enthält allgemeine Fehler und die Syntaxanzeige.
# command.admin.* und command.pay.* enthalten pfadspezifische Texte.
# Die bisherigen Schlüssel (no-permission, usage-…) bleiben als
# Fallback gültig; die neuen Schlüssel haben Vorrang.
# ------------------------------------------------------------------
command:
  _default:
    usage: "<red>Verwendung: <yellow>%syntax%"
    error:
      no-permission: "<red>Dazu hast du keine Berechtigung."
      player-only: "<red>Dieser Befehl ist nur für Spieler verfügbar."
      unknown-subcommand: "<red>Unbekannter Befehl <yellow>%input%<red>. Meintest du <yellow>%suggestion%<red>?"
      unknown-subcommand-plain: "<red>Unbekannten Befehl <yellow>%input%<red> gibt es nicht. <gray>/eco help zeigt alle Befehle."
      confirm-required: "<red>Wiederhole den Befehl mit <yellow>--confirm<red>: <yellow>%syntax%"
      rate-limited: "<red>Bitte warte noch <yellow>%seconds% Sekunden<red>."
      read-only: "<red>Dieser Server ist schreibgeschützt (READ_ONLY). Geldbewegungen sind hier deaktiviert."
  admin:
    interest:
      show: "<gray>Sparzins: <yellow>%savings% <dark_gray>| <gray>Kreditzins: <yellow>%credit%"
    credit:
      list:
        header: "<gold><bold>Kredite <dark_gray>(<gray>%player%<dark_gray>)"
        empty: "<gray>%player% hat keine laufenden Kredite."
  pay:
    error:
      recipient-online-only: "<red>Der Empfänger muss auf diesem Server online sein (network.transfer.mode: LOCAL)."
      no-route: "<red>Für den Empfänger ist kein Zielserver bekannt."
      remote-not-allowed: "<red>Serverübergreifende Überweisungen erfordern economysystem.pay.remote."
      remote-failed: "<red>Die Überweisung konnte nicht gebucht werden. Bitte informiere einen Administrator."
      duplicate: "<yellow>Diese Überweisung wurde bereits gebucht (gleiche tx-id)."
      insufficient: "<red>Du hast nicht genug Geld für diese Überweisung."
    remote-sent: "<green>Überweisung gebucht: <gold>%amount% <green>an <yellow>%player%<green>. <dark_gray>(tx %tx%)"

# ------------------------------------------------------------------
# Allgemeine Fallback-Texte. Sie werden verwendet, wenn ein neuer
# command.*-Schlüssel fehlt oder ein Modul bewusst den alten Key nutzt.
# ------------------------------------------------------------------
no-permission: "<red>Dazu hast du keine Berechtigung."
player-only: "<red>Dieser Befehl ist nur für Spieler verfügbar."
read-only: "<red>Dieser Server ist schreibgeschützt (READ_ONLY). Geldbewegungen sind hier deaktiviert."
player-not-found: "<red>Der Spieler <yellow>%player% <red>wurde nicht gefunden."
