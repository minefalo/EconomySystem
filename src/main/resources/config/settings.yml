# ==========================================================
#  EconomySystem - Einstellungen
# ==========================================================

config-version: 6

# Zeitzone für Zinsplan und Datumsanzeigen (z. B. "Europe/Berlin").
# Leer = Zeitzone des Servers. Im Netzwerk müssen alle Server dieselbe
# Zeitzone verwenden, damit sie denselben Zinszyklus-Schlüssel bilden.
time-zone: ""

# Test-Befehle (/economysystem-admin tests ...) freischalten.
# ACHTUNG: Die Test-Befehle verändern echte Kontostände, indem sie
# Zinszyklen sofort ausführen. Nur auf Test-/Entwicklungsservern
# aktivieren.
tests:
  enabled: false

  # Maximale Anzahl Zyklen für /economysystem-admin tests zins-zyklus add.
  # Gilt zusätzlich zur Permission economysystem.tests (1 - 10000).
  max-cycles: 1000

currency:
  # Anzeigename der Währung (z. B. in Nachrichten über %currency%)
  name: "Coins"

  # Symbol der Währung
  symbol: "$"

  # Anzeigeformat der Beträge.
  # Platzhalter: %symbol%, %amount%, %name%
  format: "%symbol%%amount%"

  # Zahlenformat (Java DecimalFormat-Pattern)
  number-format: "#,##0.00"

  # Locale für Trennzeichen (z. B. de-DE -> 1.234,56)
  locale: "de-DE"

  # Nachkommastellen (0 - 8)
  decimals: 2

  # Rundungsmodus:
  # UP, DOWN, CEILING, FLOOR, HALF_UP, HALF_DOWN, HALF_EVEN
  rounding: HALF_UP

  # Startguthaben für neue Spieler
  starting-balance: "100.00"

  # Maximales Guthaben ("-1" = unbegrenzt)
  max-balance: "1000000000.00"

  # Minimales Guthaben für erzwungene Abbuchungen (z. B. fällige Kredite).
  # "0" = kein Überziehen, negative Werte erlauben einen Dispo bis hierhin.
  min-balance: "-1000.00"

interest:
  # Zinszyklus automatisch ausführen
  enabled: true

  # Uhrzeit des ersten Laufs (Zeit in time-zone, Format HH:mm)
  start-time: "00:01"

  # Abstand zwischen zwei Zinszyklen in Minuten
  # 1440 = täglich, 10080 = wöchentlich
  interval-minutes: 1440

  # Faktoren a der Blockcraft-Wirtschaftsformel y = a * sqrt(x)
  factors:
    # Sparzins - wird am Zyklusende allen Konten gutgeschrieben
    spar: "1.3"
    # Kreditzins - a in der Kreditformel y = x * m + a
    kredit: "1.3"

  # Online-Spieler nach jedem Zyklus über ihre persönliche Gutschrift
  # informieren (Chat). Bei kurzen Intervallen ggf. deaktivieren.
  notify-players: true

  # Wer führt den Zyklus aus (Commands.md, 11.4)?
  #   auto      -> der Server, der die Lease für den Scope hält (Standard)
  #   <server>  -> genau dieser Server aus network.id
  executor: "auto"

credits:
  # Kreditsystem aktivieren (/kredit)
  enabled: true

  # Maximale Anzahl gleichzeitiger Kredite pro Spieler
  max-loans: 3

  # Kreditrahmen = multiplier * (Guthaben - offene Kredite)
  # Ist das Guthaben nach Abzug der Kredite negativ, wird kein Kredit vergeben.
  limit-multiplier: "3.0"

  # Steigung m der Zinsformel y = x * m + a
  # x = Laufzeit in Tagen, a = interest.factors.kredit
  # y ist der absolute Zinsbetrag, der zusätzlich zurückgezahlt wird.
  slope: "0.5"

  # Mindestbetrag eines Kredits
  minimum-amount: "10.00"

  # Laufzeit in Tagen (natürliche Zahlen)
  min-days: 1
  max-days: 365

  # Intervall in Sekunden, in dem fällige Kredite geprüft werden
  check-interval-seconds: 60

  # Datumsformat für Fälligkeiten (Java DateTimeFormatter).
  # Beispiele: "dd.MM.yyyy HH:mm", "yyyy-MM-dd HH:mm"
  date-format: "dd.MM.yyyy HH:mm"

leaderboard:
  # Einträge pro Seite bei /money top
  page-size: 10

  # Maximale Anzahl Einträge, die für die Bestenliste geladen werden
  max-entries: 100

  # Auch Konten mit Guthaben 0 in /money top aufnehmen.
  # Negative Guthaben werden nie angezeigt; Platzhalter bleiben positiv.
  include-zero-balances: false

placeholder:
  # Lebensdauer zwischengespeicherter Offline-Guthaben in Sekunden.
  cache-ttl-seconds: 30

  # Lebensdauer für "kein Konto vorhanden" in Sekunden.
  negative-cache-ttl-seconds: 10

  # Nach dieser Zeit werden alte Cache-Einträge entfernt (>= cache-ttl).
  cache-retention-seconds: 300

  # Anzahl der Plätze in der Platzhalter-Top-Liste (1 - 1000).
  top-size: 50

  # Aktualisierungsintervall der Top-Liste in Sekunden (5 - 3600).
  top-refresh-seconds: 60

vault:
  # EconomySystem als Vault-Wirtschaftsanbieter registrieren.
  # Ohne installiertes Vault bleibt die Einstellung wirkungslos; mit Vault
  # können Shops, Scoreboards & Co. Guthaben lesen und schreiben.
  enabled: true

  # Priorität der Registrierung, falls mehrere Anbieter aktiv sind.
  # LOWEST | LOW | NORMAL | HIGH | HIGHEST
  priority: HIGH

  # Maximale Wartezeit für Vault-Zugriffe auf noch nicht geladene Konten
  # in Millisekunden (500 - 30000).
  timeout-ms: 3000

  # Einzahlungsname für Vault; leer = currency.name.
  currency-name-singular: ""

notifications:
  # Eigenes Guthaben kurz nach dem Beitritt im Chat anzeigen
  balance-on-join: true

  # Verzögerung in Ticks (20 = 1 Sekunde), damit Join-Nachrichten
  # anderer Plugins nicht überschrieben werden
  balance-on-join-delay-ticks: 20

suggestions:
  # Vorschläge für /pay <Spieler> <Betrag> (Tab-Taste)
  amounts:
    - "1"
    - "10"
    - "100"
    - "1000"
    - "10000"

  # Vorschläge für /kredit add <Betrag>
  credit-amounts:
    - "100"
    - "500"
    - "1000"
    - "5000"

  # Vorschläge für /kredit bezahlen [Betrag]
  repay-amounts:
    - "10"
    - "50"
    - "100"
    - "500"

  # Vorschläge für die Laufzeit in Tagen
  credit-days:
    - "7"
    - "30"
    - "90"

# Netzwerkbetrieb (Commands.md, Abschnitt 11). Ohne MySQL bleibt alles
# Einzelserver-Verhalten: die Speicher-Schnittstelle beantwortet Lease,
# Idempotenz und Audit mit den Standardwerten (Lease immer frei).
network:
  # Eindeutiger Name dieses Servers in der Datenbank.
  id: "default"

  # Gruppe für gruppenweite Wirtschaftsräume (z. B. "survival").
  group: "default"

  # Wer teilt sich Guthaben?
  #   shared -> alle Server des Netzwerks (Standard, entspricht heute)
  #   group  -> nur Server derselben group
  #   server -> jeder Server für sich
  economy-scope: "shared"

  # FULL = lesen und schreiben, READ_ONLY = nur lesen (z. B. Lobby).
  # READ_ONLY sperrt alle schreibenden Pfade im Router (11.8).
  mode: "FULL"

  # Wie erfahren Server von Änderungen anderer Server?
  #   NONE | TTL | PLUGIN_MESSAGE | REDIS
  # Derzeit ohne Wirkung: Cache-Invalidierung ist noch nicht umgesetzt.
  invalidation: "TTL"

  # Lebensdauer zwischengespeicherter Kontostände in Sekunden.
  # Derzeit ohne Wirkung: der Kontencache hat noch keine TTL-Prüfung.
  cache-ttl-seconds: 60

  # Laufzeit der Lease für den Zinszyklus in Sekunden (60 - 3600).
  # Nach einem Absturz übernimmt der nächste Server, sobald sie abläuft.
  lease-ttl-seconds: 300

  # Serverübergreifende Überweisung (11.2).
  transfer:
    # LOCAL -> Ziel muss auf diesem Server online sein (heutiges Verhalten)
    # PROXY -> Ziel darf auf einem anderen Server online sein
    # ANY   -> Ziel darf offline sein (Konto per UUID)
    mode: "LOCAL"
    # Derzeit ohne Wirkung: eine Rückbuchung nach Timeout ist noch nicht
    # umgesetzt (nur für den Netzwerkbetrieb vorgesehen).
    timeout-seconds: 30

  # Rate-Limits je Spieler und Pfad (11.7); der Router erzwingt sie vor der
  # Fachlogik. count = erlaubte Aufrufe je Fenster (0 = unbegrenzt),
  # seconds = Fensterlänge, cooldown-seconds = Mindestabstand (0 = keiner).
  limits:
    pay:
      count: 10
      seconds: 60
      cooldown-seconds: 3
    credit:
      take:
        count: 3
        seconds: 300
        cooldown-seconds: 10
    admin:
      balance:
        count: 60
        seconds: 60
        cooldown-seconds: 0
    gui:
      count: 0
      seconds: 60
      cooldown-seconds: 2
    balance:
      top:
        count: 0
        seconds: 60
        cooldown-seconds: 2

audit:
  # Audit-Einträge für Fernbuchungen schreiben (nur MySQL).
  enabled: true

  # Aufbewahrung in Tagen (0 - 3650); 0 = unbegrenzt.
  # Die Aufräumaufgabe läuft täglich für den aktuellen Scope.
  retention-days: 0

storage:
  # Speicherart: YAML oder MYSQL
  type: YAML

  # Intervall in Sekunden, in dem geänderte Konten gespeichert werden.
  # 0 = kein automatisches Speichern (nur beim Verlassen/Stoppen des Servers)
  save-interval-seconds: 300

  # Maximale Wartezeit beim Stoppen in Sekunden (5 - 600), bis offene
  # Speichervorgänge abgebrochen werden.
  shutdown-timeout-seconds: 60

  yaml:
    # Ordner (relativ zum Plugin-Ordner), in dem die Konten liegen
    folder: "accounts"

  mysql:
    host: "localhost"
    port: 3306
    database: "minecraft"
    # Eigenen Datenbanknutzer verwenden; Passwortdatei vor Zugriff schützen.
    username: "economysystem"
    password: ""
    # Präfix der Tabelle (nur A-Z, a-z, 0-9 und _)
    table-prefix: "economy_"

    # TLS-Modus: VERIFY_IDENTITY, VERIFY_CA, REQUIRED, PREFERRED oder DISABLED.
    # VERIFY_IDENTITY prüft Zertifikat und Hostnamen. Leer lassen, um
    # use-ssl zu verwenden (true -> VERIFY_IDENTITY, false -> DISABLED).
    ssl-mode: ""

    # Veraltet: wird nur ausgewertet, wenn ssl-mode leer ist.
    use-ssl: true

    connection-timeout-ms: 5000
    socket-timeout-ms: 30000

    # Wartezeit nach einem Verbindungsfehler in Sekunden (1 - 300).
    retry-seconds: 5

config:
  # Anzahl der Sicherungen je Konfigurationsdatei (1 - 20).
  # Die neueste Sicherung behält den bisherigen Dateinamen,
  # ältere liegen als .1, .2, ... daneben.
  backup-count: 1

commands:
  # Maximale Länge einer --reason-Begründung (1 - 160).
  # 160 ist die Obergrenze der Audit-Spalte in MySQL.
  reason-max-length: 160
