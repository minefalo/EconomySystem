# ==========================================================
#  EconomySystem - Einstellungen
# ==========================================================
# Alle Werte werden beim Start und bei /eco admin reload geprüft.
# Ungültige Werte werden auf den Standard zurückgesetzt und in der
# Konsole gemeldet. Nach Änderungen immer neu laden und die Konsole
# prüfen.
#
# Die Kommentare werden vom Config-Updater aus der JAR-Vorlage
# übernommen. Eigene Werte bleiben erhalten; eigene Kommentare an
# Stellen, für die die Vorlage einen Kommentar enthält, werden
# ersetzt. Vor jeder Änderung legt der Updater eine Sicherung unter
# config/backup/ an.
#
# Wichtig für den Netzwerkbetrieb:
#   - network.economy-scope teilt KEINE Konten. Alle Server mit
#     derselben Datenbank lesen und schreiben dieselben Konten.
#   - network.invalidation, network.cache-ttl-seconds und
#     network.transfer.timeout-seconds werden gelesen, haben aber
#     derzeit keine Wirkung.
#   - READ_ONLY blockiert den Command-Router und Vault, aber nicht
#     den geplanten Zinszyklus oder fällige Kreditabbuchungen.
# ==========================================================

# Zeitzone für Zinsplan und Datumsanzeigen (z. B. "Europe/Berlin").
# Leer = Zeitzone des Servers. Im Netzwerk müssen alle Server dieselbe
# Zeitzone verwenden, damit sie denselben Zinszyklus-Schlüssel bilden.
time-zone: ""

# Test-Befehle (/eco admin test bzw. /economysystem-admin tests ...)
# freischalten.
# ACHTUNG: Die Test-Befehle verändern echte Kontostände, indem sie
# Zinszyklen sofort ausführen. Nur auf Test-/Entwicklungsservern
# aktivieren und vorher sichern.
tests:
  enabled: false

  # Maximale Anzahl Zyklen für /eco admin test interest-cycle add.
  # Gilt zusätzlich zur Permission economysystem.tests bzw.
  # economysystem.command.admin.test (1 - 10000).
  max-cycles: 1000

currency:
  # Anzeigename der Währung (z. B. in Nachrichten über %currency%)
  name: "Coins"

  # Symbol der Währung
  symbol: "$"

  # Anzeigeformat der Beträge.
  # Platzhalter: %symbol%, %amount%, %name%
  format: "%symbol%%amount%"

  # Zahlenformat (Java DecimalFormat-Pattern)
  number-format: "#,##0.00"

  # Locale für Trennzeichen (z. B. de-DE -> 1.234,56)
  locale: "de-DE"

  # Nachkommastellen (0 - 8)
  decimals: 2

  # Rundungsmodus:
  # UP, DOWN, CEILING, FLOOR, HALF_UP, HALF_DOWN, HALF_EVEN
  rounding: HALF_UP

  # Startguthaben für neue Spieler. Gilt nur für neu angelegte
  # Konten; bestehende Konten werden nicht angehoben.
  starting-balance: "100.00"

  # Maximales Guthaben ("-1" = unbegrenzt).
  # Bei MySQL begrenzt DECIMAL(30,8) den Wert praktisch; SQLite
  # speichert Beträge als Text ohne diese Grenze.
  max-balance: "1000000000.00"

  # Minimales Guthaben für erzwungene Abbuchungen (z. B. fällige
  # Kredite). "0" = kein Überziehen, negative Werte erlauben einen
  # Dispo bis hierhin. Normale Abbuchungen und /pay lassen kein
  # negatives Guthaben zu.
  min-balance: "-1000.00"

interest:
  # Zinszyklus automatisch ausführen
  enabled: true

  # Uhrzeit des ersten Laufs (Zeit in time-zone, Format HH:mm)
  start-time: "00:01"

  # Abstand zwischen zwei Zinszyklen in Minuten
  # 1440 = täglich, 10080 = wöchentlich (1 - 525600)
  interval-minutes: 1440

  # Faktoren a der Blockcraft-Wirtschaftsformel y = a * sqrt(x)
  factors:
    # Sparzins - wird am Zyklusende allen Konten mit Guthaben > 0
    # gutgeschrieben. Konten mit Guthaben <= 0 oder am Maximal-
    # guthaben erhalten keinen Zins.
    spar: "1.3"
    # Kreditzins - a in der Kreditformel y = x * m + a.
    # Gilt ab sofort für neue Kredite.
    kredit: "1.3"

  # Online-Spieler nach jedem Zyklus über ihre persönliche
  # Gutschrift informieren (Chat). Bei kurzen Intervallen ggf.
  # deaktivieren.
  notify-players: true

  # Wer führt den Zyklus aus?
  #   auto      -> der Server, der die Lease für den Scope hält
  #   <server>  -> genau dieser Server aus network.id
  # Die Lease wirkt nur mit einer gemeinsamen MySQL-Datenbank
  # wirklich serverübergreifend. Bei SQLite und YAML läuft der
  # Zyklus lokal; READ_ONLY stoppt ihn nicht.
  executor: "auto"

credits:
  # Kreditsystem aktivieren (/eco credit). Bei false sind keine
  # neuen Kredite möglich; bestehende Schulden werden weiter
  # geprüft und getilgt.
  enabled: true

  # Maximale Anzahl gleichzeitiger Kredite pro Spieler (1 - 100)
  max-loans: 3

  # Kreditrahmen = multiplier * (Guthaben - offene Kredite)
  # Ist das Guthaben nach Abzug der Kredite null oder negativ,
  # wird kein Kredit vergeben.
  limit-multiplier: "3.0"

  # Steigung m der Zinsformel y = x * m + a
  # x = Laufzeit in Tagen, a = interest.factors.kredit
  # y ist der absolute Zinsbetrag, der zusätzlich zurückgezahlt
  # wird (kein Prozentsatz).
  slope: "0.5"

  # Mindestbetrag eines Kredits
  minimum-amount: "10.00"

  # Laufzeit in Tagen (natürliche Zahlen, 1 - 3650)
  min-days: 1
  max-days: 365

  # Intervall in Sekunden, in dem fällige Kredite geprüft werden
  # (5 - 3600).
  check-interval-seconds: 60

  # Datumsformat für Fälligkeiten (Java DateTimeFormatter).
  # Beispiele: "dd.MM.yyyy HH:mm", "yyyy-MM-dd HH:mm"
  date-format: "dd.MM.yyyy HH:mm"

leaderboard:
  # Einträge pro Seite bei /eco balance top (1 - 50)
  page-size: 10

  # Maximale Anzahl Einträge, die für die Bestenliste geladen
  # werden (mindestens page-size, höchstens 1000)
  max-entries: 100

  # Auch Konten mit Guthaben 0 in die Bestenliste aufnehmen.
  # Negative Guthaben werden nie angezeigt.
  include-zero-balances: false

placeholder:
  # Lebensdauer zwischengespeicherter Offline-Guthaben in Sekunden
  # (1 - 3600).
  cache-ttl-seconds: 30

  # Lebensdauer für "kein Konto vorhanden" in Sekunden (1 - 3600).
  negative-cache-ttl-seconds: 10

  # Nach dieser Zeit werden alte Cache-Einträge entfernt
  # (mindestens cache-ttl, höchstens 86400).
  cache-retention-seconds: 300

  # Anzahl der Plätze in der Platzhalter-Top-Liste (1 - 1000).
  # Es gibt keine Kredit-Platzhalter; %credit_*% funktioniert nur
  # in der gui.yml.
  top-size: 50

  # Aktualisierungsintervall der Top-Liste in Sekunden (5 - 3600).
  top-refresh-seconds: 60

vault:
  # EconomySystem als Vault-Wirtschaftsanbieter registrieren.
  # Ohne installiertes Vault bleibt die Einstellung wirkungslos;
  # mit Vault können Shops, Scoreboards & Co. Guthaben lesen und
  # schreiben.
  enabled: true

  # Priorität der Registrierung, falls mehrere Anbieter aktiv sind.
  # LOWEST | LOW | NORMAL | HIGH | HIGHEST
  priority: HIGH

  # Maximale Wartezeit für Vault-Zugriffe auf noch nicht geladene
  # Konten in Millisekunden (500 - 30000).
  timeout-ms: 3000

  # Einzahlungsname für Vault; leer = currency.name.
  currency-name-singular: ""

notifications:
  # Eigenes Guthaben kurz nach dem Beitritt im Chat anzeigen.
  # Hinweis: Die Join-Nachricht wird nur gesendet, wenn der Spieler
  # den alten Knoten economysystem.balance besitzt. Der moderne
  # Knoten economysystem.command.balance allein genügt hier nicht.
  balance-on-join: true

  # Verzögerung in Ticks (20 = 1 Sekunde), damit Join-Nachrichten
  # anderer Plugins nicht überschrieben werden (0 - 200).
  balance-on-join-delay-ticks: 20

suggestions:
  # Vorschläge für /pay <Spieler> <Betrag> (Tab-Taste)
  amounts:
    - "1"
    - "10"
    - "100"
    - "1000"
    - "10000"

  # Vorschläge für /eco credit take <Betrag> <Tage>
  credit-amounts:
    - "100"
    - "500"
    - "1000"
    - "5000"

  # Vorschläge für /eco credit repay [Betrag]
  repay-amounts:
    - "10"
    - "50"
    - "100"
    - "500"

  # Vorschläge für die Laufzeit in Tagen
  credit-days:
    - "7"
    - "30"
    - "90"

# Netzwerkbetrieb. Ohne gemeinsame MySQL-Datenbank bleibt alles
# Einzelserver-Verhalten. Bei YAML beantwortet die Speicher-
# Schnittstelle Lease, Idempotenz und Audit mit den Standardwerten
# (Lease immer frei); SQLite führt diese Tabellen lokal in der
# eigenen Datei.
network:
  # Eindeutiger Name dieses Servers in der Datenbank.
  id: "default"

  # Gruppe für gruppenweite Wirtschaftsräume (z. B. "survival").
  group: "default"

  # Wer teilt sich Guthaben?
  #   shared -> alle Server des Netzwerks (Standard, entspricht heute)
  #   group  -> nur Server derselben group
  #   server -> jeder Server für sich
  # ACHTUNG: Der Wert partitioniert derzeit KEINE Konten. Er fließt
  # nur in den Scope-Schlüssel für Lease, Transfer und Audit ein.
  # Getrennte Guthaben brauchen getrennte Datenbanken.
  economy-scope: "shared"

  # FULL = lesen und schreiben, READ_ONLY = nur lesen (z. B. Lobby).
  # READ_ONLY sperrt die schreibenden Pfade im Router und die
  # Vault-Buchungen, aber NICHT den geplanten Zinszyklus oder die
  # fällige Kredit-Tilgung. Für einen echten Stopp zusätzlich
  # interest.enabled: false setzen und Kredite pausieren.
  mode: "FULL"

  # Wie erfahren Server von Änderungen anderer Server?
  #   NONE | TTL | PLUGIN_MESSAGE | REDIS
  # Derzeit ohne Wirkung: Cache-Invalidierung ist noch nicht
  # umgesetzt.
  invalidation: "TTL"

  # Lebensdauer zwischengespeicherter Kontostände in Sekunden
  # (0 - 86400).
  # Derzeit ohne Wirkung: der Kontencache hat noch keine TTL-Prüfung.
  cache-ttl-seconds: 60

  # Laufzeit der Lease für den Zinszyklus in Sekunden (60 - 3600).
  # Nach einem Absturz übernimmt der nächste Server, sobald sie
  # abläuft. Nur mit gemeinsamer MySQL-Datenbank wirklich
  # serverübergreifend; bei SQLite gilt sie nur lokal.
  lease-ttl-seconds: 300

  # Serverübergreifende Überweisung.
  transfer:
    # LOCAL -> Ziel darf offline sein; gebucht wird auf das gespeicherte
    #          Konto (Standard). Der Name muss bereits existieren.
    # PROXY -> Ziel darf auf einem anderen Server online sein
    # ANY   -> Ziel darf offline sein (Konto per UUID, nur MySQL)
    # PROXY ist noch nicht implementiert und antwortet mit
    # command.pay.error.no-route. ANY setzt MySQL und die Permission
    # economysystem.pay.remote voraus.
    mode: "LOCAL"
    # Derzeit ohne Wirkung: eine Rückbuchung nach Timeout ist noch
    # nicht umgesetzt (nur für den Netzwerkbetrieb vorgesehen).
    timeout-seconds: 30

  # Rate-Limits je Spieler und Pfad; der Router erzwingt sie vor
  # der Fachlogik. count = erlaubte Aufrufe je Fenster (0 =
  # unbegrenzt), seconds = Fensterlänge, cooldown-seconds =
  # Mindestabstand (0 = keiner).
  limits:
    pay:
      count: 10
      seconds: 60
      cooldown-seconds: 3
    credit:
      take:
        count: 3
        seconds: 300
        cooldown-seconds: 10
    admin:
      balance:
        count: 60
        seconds: 60
        cooldown-seconds: 0
    gui:
      count: 0
      seconds: 60
      cooldown-seconds: 2
    balance:
      top:
        count: 0
        seconds: 60
        cooldown-seconds: 2

audit:
  # Audit-Einträge für Fernbuchungen schreiben.
  # Nur bei storage.type: SQLITE oder MYSQL und nur für
  # remoteTransferAsync.
  # Lokale /pay-Buchungen, Admin-Änderungen, Zinsen und Kredite
  # erzeugen keine Audit-Einträge. YAML-Audit ist ein No-op.
  enabled: true

  # Aufbewahrung in Tagen (0 - 3650); 0 = unbegrenzt.
  # Die Aufräumaufgabe läuft täglich für den aktuellen Scope.
  retention-days: 0

storage:
  # Speicherart: SQLITE (Standard), YAML oder MYSQL
  type: SQLITE

  # Alle lokalen Speicherdaten liegen unter data/ im Plugin-Ordner:
  # SQLite-Datei, YAML-Konten und Journals.

  # Intervall in Sekunden, in dem geänderte Konten gespeichert
  # werden. 0 = kein automatisches Speichern (nur beim Verlassen
  # und Stoppen des Servers).
  save-interval-seconds: 300

  # Maximale Wartezeit beim Stoppen in Sekunden (5 - 600), bis
  # offene Speichervorgänge abgebrochen werden.
  shutdown-timeout-seconds: 60

  sqlite:
    # Datenbankdatei, relativ zum data-Ordner. SQLite legt daneben
    # <datei>-wal und <datei>-shm an. Sichern nur bei gestopptem
    # Server oder zusammen mit diesen Dateien.
    file: "economy.db"

  yaml:
    # Ordner (relativ zum data-Ordner), in dem die Konten liegen.
    # ACHTUNG: Der Wert wird ungeprüft als Pfad verwendet; keine
    # ".."-Pfade aus nicht vertrauenswürdigen Quellen eintragen.
    # Das Journal pending-transaction.yml liegt direkt im
    # data-Ordner, nicht in diesem Ordner.
    folder: "accounts"

  mysql:
    host: "localhost"
    port: 3306
    database: "minecraft"
    # Eigenen Datenbanknutzer verwenden; Passwortdatei vor Zugriff
    # schützen.
    username: "economysystem"
    password: ""
    # Präfix der Tabellen (nur A-Z, a-z, 0-9 und _; darf leer sein).
    # Tabellen: <prefix>accounts, <prefix>loans, <prefix>transfers,
    # <prefix>audit, <prefix>locks, <prefix>interest_runs.
    table-prefix: "economy_"

    # TLS-Modus: VERIFY_IDENTITY, VERIFY_CA, REQUIRED, PREFERRED
    # oder DISABLED.
    # VERIFY_IDENTITY prüft Zertifikat und Hostnamen. Leer lassen,
    # um use-ssl zu verwenden (true -> VERIFY_IDENTITY, false ->
    # DISABLED).
    ssl-mode: ""

    # Veraltet: wird nur ausgewertet, wenn ssl-mode leer ist.
    use-ssl: true

    connection-timeout-ms: 5000
    socket-timeout-ms: 30000

    # Wartezeit nach einem Verbindungsfehler in Sekunden (1 - 300).
    retry-seconds: 5

config:
  # Anzahl der Sicherungen je Konfigurationsdatei (1 - 20).
  # Die neueste Sicherung behält den bisherigen Dateinamen,
  # ältere liegen als .1, .2, ... daneben. Ablage:
  # config/backup/<datei>.vor-config-update.bak
  backup-count: 1

commands:
  # Maximale Länge einer --reason-Begründung (1 - 160).
  # 160 ist die Obergrenze der Audit-Spalte in MySQL.
  # Hinweis: --reason wird derzeit geparst, aber von keinem Modul
  # gespeichert. --dry-run und --silent sind wirkungslos.
  reason-max-length: 160
